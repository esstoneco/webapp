name: Deploy React Website to Pages

on:
  push:
    branches: ["main"] # Triggers the action on every push to main
  workflow_dispatch: # Allows you to manually trigger the build from GitHub UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we are building and deploying sequentially
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci # Faster, cleaner install for automated environments

      - name: Build Production Bundle
        run: npm run build

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: 
          # Change to './build' if using Create React App
          # Leave as './dist' if using Vite
          path: './dist' 

      - name: Deploy to GitHub Pages (v4)
        id: deployment
        uses: actions/deploy-pages@v4
